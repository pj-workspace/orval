name: Validate Pinia Colada implementation
on:
  push:
    branches: [validation/orval-3341]
permissions:
  contents: read
concurrency:
  group: orval-3341-feasibility
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'pj-workspace/orval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          run-install: false
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Resolve new workspace dependencies with security scanning
        run: |
          bun install
          bun install --frozen-lockfile
      - name: Build packages
        run: vp run -w build:release
      - name: Generate all Colada fixtures
        run: vp run -F pinia-colada-sample generate-api
      - name: Typecheck packages and generated clients
        run: |
          vp run -w typecheck
          vp run -F pinia-colada-sample test
      - name: Generator integration tests
        run: vp test run packages/orval/src/pinia-colada.test.ts
      - name: Format and lint
        run: |
          vp fmt --check
          vp run -w lint
          vp lint samples/pinia-colada
      - name: Build English sample
        run: vp run -F pinia-colada-sample build
      - name: Browser acceptance
        working-directory: samples/pinia-colada
        run: |
          bun x --no-install playwright install --with-deps chromium
          bun run test:browser
      - name: Test all packages
        run: vp run -w test
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: pinia-colada-implementation-evidence
          path: |
            bun.lock
            samples/pinia-colada/src/gen
            samples/pinia-colada/dist
            samples/pinia-colada/test-results
