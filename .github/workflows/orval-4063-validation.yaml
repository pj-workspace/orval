name: Validate date-time-local contribution

on:
  push:
    branches: [validation/orval-4063]

permissions:
  contents: read

concurrency:
  group: validate-orval-4063
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'pj-workspace/orval'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: false
          run-install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install with unchanged security scanner and lockfile
        run: vp install --frozen-lockfile
      - name: Verify setup preserves committed validation inputs
        run: git diff --exit-code -- bun.lock bunfig.toml packages/zod/src/index.ts packages/zod/src/zod.test.ts
      - name: Prepare repository
        run: vp run prepare
      - name: Build packages
        run: vp run -w build:release
      - name: Prove regression fails on original source
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore --source=HEAD -- packages/zod/src/index.ts' EXIT
          git show bc19a8e8044dcb858a7df6a2e706d05259b30484:packages/zod/src/index.ts > packages/zod/src/index.ts
          set +e
          vp test run packages/zod/src/zod.test.ts -t date-time-local --reporter=json --outputFile="$RUNNER_TEMP/orval-4063-baseline.json"
          result=$?
          set -e
          test "$result" -eq 1
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/orval-4063-baseline.json`, 'utf8'));
          assert.equal(report.numFailedTests, 6);
          assert.equal(report.numPassedTests, 3);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Original source: 6 new-format regressions fail; 3 existing date-time cases pass.\n');
          JS
      - name: Run Zod tests with the fix
        run: vp test run packages/zod/src/zod.test.ts
      - name: Validate generated schemas with Zod 3, Zod 4 and mini
        run: bun .github/scripts/validate-orval-4063.ts
      - name: Run repository check
        run: vp check
      - name: Lint packages
        run: vp run -w lint
      - name: Lint samples
        run: vp run -w lint:samples
      - name: Lint snapshots
        run: vp run -w lint:snapshots
      - name: Typecheck packages
        run: vp run -w typecheck
      - name: Test packages
        run: vp run -w test
      - name: Verify snapshots
        run: vp run -w test:snapshots
      - name: Test samples
        run: vp run -w test:samples
      - name: Build generated code
        run: vp run -F orval-tests build
      - name: Verify contribution and lockfile remain unchanged
        run: git diff --exit-code -- packages/zod/src/index.ts packages/zod/src/zod.test.ts bun.lock bunfig.toml
